<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>FullStack PEP</title>
	<style>
		:root {
			color-scheme: dark;
			font-family: Georgia, "Times New Roman", serif;
			background: #101820;
			color: #f6f1e9;
		}

		body {
			display: grid;
			min-height: 100vh;
			margin: 0;
			place-items: center;
			background: radial-gradient(circle at top, #244b4b, #101820 58%);
		}

		main {
			max-width: 680px;
			padding: 48px 28px;
			text-align: center;
		}

		h1 {
			margin: 0 0 16px;
			font-size: clamp(2.5rem, 8vw, 5rem);
			letter-spacing: 0.02em;
		}

		p {
			margin: 0;
			color: #b8d8d8;
			font-size: 1.2rem;
			line-height: 1.6;
		}

		.status {
			display: inline-block;
			margin-top: 28px;
			padding: 10px 16px;
			border: 1px solid #8bd3c7;
			border-radius: 999px;
			color: #8bd3c7;
			font: 700 0.85rem/1.2 system-ui, sans-serif;
			letter-spacing: 0.12em;
			text-transform: uppercase;
		}
	</style>
</head>
<body>
	<main>
		<h1>FullStack PEP</h1>
		<p>Your GitHub-connected Vercel deployment is live.</p>
		<span class="status">Deployment test passed</span>
	</main>
</body>
</html>
